name: combine-epg

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */9 * * *'  # Every 9 hours

permissions:
  contents: write

concurrency:
  group: combine-epg
  cancel-in-progress: false

jobs:
  merge_epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      ############################################################
      # FETCH SOURCES
      # - Downloads every EPG straight from its URL.
      # - Each download is validated (non-empty, looks like XML or
      #   valid gzip) before it replaces the local copy.
      # - If a download fails, the previous local copy (if any) is
      #   kept and the merge carries on with it.
      ############################################################
      - name: Fetch EPG sources
        run: |
          fetch() {
            url="$1"; out="$2"
            tmp="${out}.tmp"
            if ! curl -fsSL --retry 3 --retry-delay 10 -A "Mozilla/5.0" -o "$tmp" "$url"; then
              echo "WARNING: download failed for $url"
              rm -f "$tmp"; return 0
            fi
            if [ ! -s "$tmp" ]; then
              echo "WARNING: empty download for $url"
              rm -f "$tmp"; return 0
            fi
            case "$out" in
              *.gz)
                if ! gzip -t "$tmp" 2>/dev/null; then
                  echo "WARNING: $out is not valid gzip"
                  rm -f "$tmp"; return 0
                fi
                ;;
              *)
                if ! head -c 500 "$tmp" | grep -q "<?xml\|<tv"; then
                  echo "WARNING: $out does not look like XML"
                  rm -f "$tmp"; return 0
                fi
                ;;
            esac
            mv "$tmp" "$out"
            echo "OK: $out ($(du -h "$out" | cut -f1))"
          }

          fetch "https://raw.githubusercontent.com/atone77721/CIGNAL_EPG/refs/heads/main/cignal-epg.xml"       cignal-epg.xml
          fetch "https://raw.githubusercontent.com/atone77721/CIGNAL_EPG/refs/heads/main/clickthecity_epg.xml" clickthecity_epg.xml
          fetch "https://raw.githubusercontent.com/atone77721/CIGNAL_EPG/refs/heads/main/dzmm.xml"             dzmm.xml
          fetch "https://raw.githubusercontent.com/atone77721/AMZN_EPG/main/data/amazon.xml"                   amazon.xml
          fetch "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz"                                   epg_ripper_US2.xml.gz
          fetch "https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz"                                   epg_ripper_CA2.xml.gz
          fetch "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz"                                   epg_ripper_UK1.xml.gz

      ############################################################
      # SMART MERGE
      # - Channel IDs are kept as-is unless the same ID appears in
      #   more than one source. Only those clashing IDs get the
      #   source suffix (e.g. GMA7 -> GMA7.cignal / GMA7.click).
      # - Programmes follow their channel's (possibly renamed) ID.
      # - Exact duplicate channels/programmes are dropped.
      ############################################################
      - name: Merge XML files
        run: |
          cat > merge_epg.py <<'PY'
          import gzip
          import os
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          # (file, suffix) -- add or remove sources here
          SOURCES = [
              ("cignal-epg.xml",         "cignal"),
              ("clickthecity_epg.xml",   "click"),
              ("dzmm.xml",               "dzmm"),
              ("amazon.xml",             "amazon"),
              ("epg_ripper_US2.xml.gz",  "us2"),   # .gz is auto-detected
              ("epg_ripper_CA2.xml.gz",  "ca2"),
              ("epg_ripper_UK1.xml.gz",  "uk1"),
          ]
          OUTPUT = "merged_epg.xml"
          REPORT = "merge_report.txt"

          def key(cid):
              return cid.strip().casefold()

          def open_source(path):
              # Detect gzip by magic bytes, not by file extension
              with open(path, "rb") as f:
                  magic = f.read(2)
              if magic == b"\x1f\x8b":
                  return gzip.open(path, "rb")
              return open(path, "rb")

          # ---------- load sources ----------
          loaded = []  # (suffix, root)
          for path, suffix in SOURCES:
              if not os.path.exists(path):
                  print(f"WARNING: {path} not found, skipping")
                  continue
              try:
                  with open_source(path) as f:
                      root = ET.parse(f).getroot()
              except (ET.ParseError, OSError, EOFError) as e:
                  print(f"WARNING: {path} could not be read ({e}), skipping")
                  continue
              loaded.append((path, suffix, root))

          if not loaded:
              sys.exit("ERROR: no usable source files")

          # ---------- find IDs that clash across different sources ----------
          sources_per_id = defaultdict(set)
          for path, suffix, root in loaded:
              for ch in root.findall("channel"):
                  cid = ch.get("id")
                  if cid:
                      sources_per_id[key(cid)].add(suffix)
          clashing = {k for k, s in sources_per_id.items() if len(s) > 1}

          # ---------- build merged tree ----------
          merged = ET.Element("tv", loaded[0][2].attrib)
          seen_channels = set()
          seen_programmes = set()
          renamed = []       # (source, old, new)
          dropped_ch = 0
          dropped_pr = 0
          counts = {}

          for path, suffix, root in loaded:
              idmap = {}
              n_ch = n_pr = 0

              for ch in root.findall("channel"):
                  old = ch.get("id")
                  if not old:
                      continue
                  new = f"{old}.{suffix}" if key(old) in clashing else old
                  idmap[old] = new
                  if new != old:
                      renamed.append((path, old, new))
                  if key(new) in seen_channels:
                      dropped_ch += 1
                      continue
                  seen_channels.add(key(new))
                  ch.set("id", new)
                  merged.append(ch)
                  n_ch += 1

              for pr in root.findall("programme"):
                  old = pr.get("channel")
                  if not old:
                      continue
                  new = idmap.get(old, old)
                  pr.set("channel", new)
                  sig = (key(new), pr.get("start"), pr.get("stop"))
                  if sig in seen_programmes:
                      dropped_pr += 1
                      continue
                  seen_programmes.add(sig)
                  merged.append(pr)
                  n_pr += 1

              counts[path] = (n_ch, n_pr)

          # ---------- write output ----------
          ET.indent(merged)
          ET.ElementTree(merged).write(OUTPUT, encoding="UTF-8", xml_declaration=True)

          # ---------- validate by re-parsing ----------
          ET.parse(OUTPUT)

          # ---------- report ----------
          lines = ["EPG merge report", "================"]
          for path, (c, p) in counts.items():
              lines.append(f"{path}: {c} channels, {p} programmes")
          lines.append("")
          lines.append(f"Channel IDs renamed due to clashes: {len(renamed)}")
          for src, old, new in renamed:
              lines.append(f"  [{src}] {old} -> {new}")
          lines.append(f"Exact duplicate channels dropped:   {dropped_ch}")
          lines.append(f"Exact duplicate programmes dropped: {dropped_pr}")
          report = "\n".join(lines)
          open(REPORT, "w", encoding="utf-8").write(report + "\n")
          print(report)
          PY

          python3 merge_epg.py

      ############################################################
      # GZIP OUTPUT
      ############################################################
      - name: GZIP output
        run: |
          gzip -9 -c merged_epg.xml > merged_epg.xml.gz
          rm -f merged_epg.xml
          ls -lh merged_epg.xml.gz

      ############################################################
      # COMMIT & PUSH
      ############################################################
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stop tracking the old uncompressed file if it exists in the repo
          git rm --cached --ignore-unmatch -q merged_epg.xml

          git add merged_epg.xml.gz merge_report.txt

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Updated merged EPG"

          # Downloaded source files are tracked in the repo and now show as
          # modified; they're already merged, so discard them before rebasing.
          git checkout -- .
          git pull --rebase
          git push
